[package]
name = "murasame"
version = "0.1.0"
edition = "2024"

[dependencies]
mocari = { path = "submodules/mocari", features = ["wgpu"] }
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-default", "renderer-femtovg-wgpu", "unstable-wgpu-30", "system-tray", "accessibility", "compat-1-18"] }
wgpu = "30.0.1"

tokio = { version = "1.45", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Audio & Lip-sync
rodio = "0.20"
hound = "3.5"
minimp3 = "0.5"
rubato = "0.16"
rand = "0.8"
edge-tts-rust = { git = "https://github.com/initsnow/edge-tts-rust", rev = "0e496d448c6a14e99da580a0d0b1af85279e0250" }

# AI & Network
async-openai = "0.28"
futures-util = "0.3"
pollster = "0.4"

[build-dependencies]
slint-build = "1.18.1"
