name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.2.1)'
        required: false
        default: 'v0.2.1'
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release-windows:
    name: Build Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Fetch Submodule Git LFS
        shell: pwsh
        run: |
          git -C models/murasame-beatrice-v1 lfs pull

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-release-cargo

      - name: Determine Version & Tag
        id: vars
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.event.inputs.tag_name }}' -ne '') {
              $tag = '${{ github.event.inputs.tag_name }}'
          } else {
              $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          }
          Write-Host "Releasing tag: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run Tests
        run: cargo test --release

      - name: Build Release Binaries
        run: cargo build --release --bin murasame --bin voice-tune

      - name: Assemble Release Package
        shell: pwsh
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          $pkgDir = "murasame-$tag-windows-x64"
          $archiveName = "murasame-$tag-windows-x64.zip"

          Write-Host "Creating release package directory: $pkgDir"
          New-Item -ItemType Directory -Path $pkgDir | Out-Null

          # 1. Copy Executables & Native Runtime DLLs
          Copy-Item "target/release/murasame.exe" "$pkgDir/"
          if (Test-Path "target/release/voice-tune.exe") {
              Copy-Item "target/release/voice-tune.exe" "$pkgDir/"
          }
          if (Test-Path "target/release/Live2DCubismCore.dll") {
              Copy-Item "target/release/Live2DCubismCore.dll" "$pkgDir/"
          } elseif (Test-Path "lib/x86_64-pc-windows-msvc/Live2DCubismCore.dll") {
              Copy-Item "lib/x86_64-pc-windows-msvc/Live2DCubismCore.dll" "$pkgDir/"
          }

          # 2. Copy Configurations and Assets
          Copy-Item "config.toml" "$pkgDir/"
          Copy-Item -Recurse "characters" "$pkgDir/"
          Copy-Item -Recurse "Murasame_live2d" "$pkgDir/"
          Copy-Item -Recurse "assets" "$pkgDir/"

          # 3. Copy Models
          New-Item -ItemType Directory -Path "$pkgDir/models" | Out-Null
          Copy-Item -Recurse "models/murasame-beatrice-v1" "$pkgDir/models/"

          # 4. Clean up any git metadata residue in packaged submodules
          Get-ChildItem -Path $pkgDir -Recurse -Include ".git*", ".git" -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          # 5. Compress Archive
          Write-Host "Compressing to $archiveName..."
          Compress-Archive -Path $pkgDir -DestinationPath $archiveName -Force

          # 6. Generate SHA-256 Checksum
          $hash = (Get-FileHash -Algorithm SHA256 $archiveName).Hash.ToLower()
          "$hash  $archiveName" | Out-File -Encoding utf8 "$archiveName.sha256"

          Write-Host "Package created: $archiveName (SHA256: $hash)"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            murasame-*-windows-x64.zip
            murasame-*-windows-x64.zip.sha256

  build-release-linux:
    name: Build Release (Linux x64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Fetch Submodule Git LFS
        run: |
          git -C models/murasame-beatrice-v1 lfs pull

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libinput-dev \
            libgbm-dev \
            libssl-dev \
            libc++-dev \
            libc++abi-dev \
            pkg-config \
            cmake \
            file \
            wget

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-release-cargo

      - name: Determine Version & Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: $TAG"

      - name: Run Tests
        run: cargo test --release

      - name: Build Release Binaries
        run: cargo build --release --bin murasame --bin voice-tune

      - name: Assemble Linux Tarball
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          PKG_DIR="murasame-$TAG-linux-x64"
          ARCHIVE="$PKG_DIR.tar.gz"

          echo "Assembling $PKG_DIR..."
          mkdir -p "$PKG_DIR"
          cp target/release/murasame "$PKG_DIR/"
          [ -f target/release/voice-tune ] && cp target/release/voice-tune "$PKG_DIR/"
          cp config.toml "$PKG_DIR/"
          cp -r characters Murasame_live2d assets "$PKG_DIR/"
          mkdir -p "$PKG_DIR/models"
          cp -r models/murasame-beatrice-v1 "$PKG_DIR/models/"
          cp assets/murasame.desktop "$PKG_DIR/"
          cp assets/icons/app_icon.png "$PKG_DIR/"

          # Clean up any git metadata residue in packaged submodules
          find "$PKG_DIR" -name ".git*" -exec rm -rf {} + 2>/dev/null || true

          tar -czf "$ARCHIVE" "$PKG_DIR"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "Created $ARCHIVE"

      - name: Assemble Linux AppImage
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          APPDIR="AppDir"
          APPIMAGE="murasame-$TAG-x86_64.AppImage"

          echo "Assembling AppDir..."
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/lib"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/192x192/apps"
          mkdir -p "$APPDIR/usr/share/murasame"

          # 1. Executables
          cp target/release/murasame "$APPDIR/usr/bin/"
          [ -f target/release/voice-tune ] && cp target/release/voice-tune "$APPDIR/usr/bin/"

          # 2. Bundle LLVM libc++ dynamic libs for broad Linux distribution compatibility
          find /usr/lib /usr/lib/x86_64-linux-gnu -name "libc++.so.1*" -exec cp -d {} "$APPDIR/usr/lib/" \; 2>/dev/null || true
          find /usr/lib /usr/lib/x86_64-linux-gnu -name "libc++abi.so.1*" -exec cp -d {} "$APPDIR/usr/lib/" \; 2>/dev/null || true

          # 3. Resources into usr/share/murasame
          cp config.toml "$APPDIR/usr/share/murasame/"
          cp -r characters Murasame_live2d assets "$APPDIR/usr/share/murasame/"
          mkdir -p "$APPDIR/usr/share/murasame/models"
          cp -r models/murasame-beatrice-v1 "$APPDIR/usr/share/murasame/models/"

          # Link resources to AppDir root for flexible lookups
          ln -s usr/share/murasame/characters "$APPDIR/characters"
          ln -s usr/share/murasame/Murasame_live2d "$APPDIR/Murasame_live2d"
          ln -s usr/share/murasame/models "$APPDIR/models"
          ln -s usr/share/murasame/assets "$APPDIR/assets"
          ln -s usr/share/murasame/config.toml "$APPDIR/config.toml"

          # Clean git residues
          find "$APPDIR" -name ".git*" -exec rm -rf {} + 2>/dev/null || true

          # 4. Desktop entry and icons
          cp assets/murasame.desktop "$APPDIR/murasame.desktop"
          cp assets/murasame.desktop "$APPDIR/usr/share/applications/murasame.desktop"
          cp assets/icons/app_icon.png "$APPDIR/murasame.png"
          cp assets/icons/app_icon.png "$APPDIR/.DirIcon"
          cp assets/icons/app_icon.png "$APPDIR/usr/share/icons/hicolor/192x192/apps/murasame.png"

          # 5. AppRun entrypoint script
          cat << 'EOF' > "$APPDIR/AppRun"
          #!/bin/bash
          SELF=$(readlink -f "$0")
          APPDIR=$(dirname "$SELF")
          export APPDIR
          export PATH="${APPDIR}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${APPDIR}/usr/lib:${LD_LIBRARY_PATH}"
          export MURASAME_RESOURCE_DIR="${APPDIR}/usr/share/murasame"
          exec "${APPDIR}/usr/bin/murasame" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # 6. Download appimagetool and package AppImage (extract first to avoid CI FUSE issues)
          echo "Packaging AppImage..."
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun "$APPDIR" "$APPIMAGE"

          sha256sum "$APPIMAGE" > "$APPIMAGE.sha256"
          echo "Created $APPIMAGE"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            murasame-*-x86_64.AppImage
            murasame-*-x86_64.AppImage.sha256
            murasame-*-linux-x64.tar.gz
            murasame-*-linux-x64.tar.gz.sha256

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-release-windows, build-release-linux]

    steps:
      - name: Determine Version & Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Murasame ${{ steps.vars.outputs.tag }}
          files: |
            murasame-*-windows-x64.zip
            murasame-*-windows-x64.zip.sha256
            murasame-*-x86_64.AppImage
            murasame-*-x86_64.AppImage.sha256
            murasame-*-linux-x64.tar.gz
            murasame-*-linux-x64.tar.gz.sha256
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
